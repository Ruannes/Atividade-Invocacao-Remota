[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rrp-udp"
version = "1.0.0"
description = "Protocolo requisição-resposta (doOperation/getRequest/sendReply) sobre sockets UDP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["sistemas-distribuidos", "rpc", "udp", "middleware"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Distributed Computing",
]

[project.scripts]
rrp = "rrp.__main__:main"

[tool.setuptools]
packages = ["rrp"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
